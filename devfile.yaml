schemaVersion: 2.2.2

metadata:
  name: ai-driven-iac-workshop
  displayName: AI-Driven IaC Workshop
  description: Simple and reliable Dev Spaces environment for Terraform, AWS CLI, and Ansible
  tags:
    - terraform
    - ansible
    - aws
    - iac

components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      cpuRequest: "1"
      cpuLimit: "4"
      memoryRequest: 2Gi
      memoryLimit: 6Gi
      mountSources: true
      sourceMapping: /projects
      env:
        - name: HOME
          value: /home/user
        - name: PATH
          value: /home/user/bin:/home/user/.local/bin:/usr/bin:/bin
        - name: TF_PLUGIN_CACHE_DIR
          value: /home/user/.terraform.d/plugin-cache
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-1
        - name: ANSIBLE_HOST_KEY_CHECKING
          value: "False"

commands:
  - id: install-tools
    exec:
      label: Install IaC tools (Terraform / AWS CLI / Ansible)
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        set -e

        echo "=== Preparing directories ==="
        mkdir -p $HOME/bin
        mkdir -p $HOME/.terraform.d/plugin-cache

        echo "=== Install Terraform ==="
        if ! command -v terraform >/dev/null 2>&1; then
          curl -fsSL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip -o terraform.zip
          unzip terraform.zip
          mv terraform $HOME/bin/
          rm terraform.zip
        fi

        echo "=== Install AWS CLI ==="
        if ! command -v aws >/dev/null 2>&1; then
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip awscliv2.zip
          ./aws/install \
            --install-dir $HOME/aws-cli \
            --bin-dir $HOME/bin
          rm -rf aws awscliv2.zip
        fi

        echo "=== Install Ansible & tools ==="
        pip3 install --user ansible ansible-lint checkov

        echo "=== Installation completed ==="
      group:
        kind: build
        isDefault: true

  - id: verify-tools
    exec:
      label: Verify installed tools
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        echo "Terraform:" && terraform version || true
        echo "AWS CLI:" && aws --version || true
        echo "Ansible:" && ansible --version | head -1 || true
        echo "Checkov:" && checkov --version || true
      group:
        kind: run

  - id: aws-configure
    exec:
      label: Configure AWS CLI
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: aws configure
      group:
        kind: run

  - id: terraform-init-dev
    exec:
      label: Terraform init (dev)
      component: tools
      workingDir: ${PROJECT_SOURCE}/terraform/environments/dev
      commandLine: terraform init
      group:
        kind: run

  - id: terraform-plan-dev
    exec:
      label: Terraform plan (dev)
      component: tools
      workingDir: ${PROJECT_SOURCE}/terraform/environments/dev
      commandLine: terraform plan
      group:
        kind: run

  - id: terraform-apply-dev
    exec:
      label: Terraform apply (dev)
      component: tools
      workingDir: ${PROJECT_SOURCE}/terraform/environments/dev
      commandLine: terraform apply
      group:
        kind: run

  - id: ansible-lint
    exec:
      label: Run Ansible Lint
      component: tools
      workingDir: ${PROJECT_SOURCE}/ansible
      commandLine: ansible-lint playbooks/
      group:
        kind: run

  - id: security-scan
    exec:
      label: Run Checkov security scan
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: checkov -d terraform/
      group:
        kind: run
